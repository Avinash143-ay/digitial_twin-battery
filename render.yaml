services:
  - type: web
    name: battery-digital-twin
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir backend backend:app --workers 1 --threads 4 --timeout 180
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.13"
      - key: FLASK_DEBUG
        value: "0"
